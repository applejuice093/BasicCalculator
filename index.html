<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="Calc.css" />
  </head>

  <body>
    <div id="main">
      <div id="head">CALCULATOR</div>

      <input
        type="text"
        id="res"
        readonly
        aria-label="Calculator display"
        aria-live="polite"
      />

      <!-- KEYPAD WRAPPER -->
      <div id="keypad" role="group" aria-label="Calculator keypad">
        <!-- NUMBER KEYS -->
        <div id="keys">
          <button>1</button><button>2</button><button>3</button
          ><button>4</button> <button>5</button><button>6</button
          ><button>7</button><button>8</button> <button>9</button
          ><button>0</button>
          <button id="calc">Calculate</button>
          <button id="clear" class="wide" aria-label="Clear">C</button>
          <button id="back" class="wide" aria-label="Backspace">&#9003;</button>
        </div>

        <!-- M KEYS -->
        <div id="mkeys">
          <button id="add" aria-label="Plus">+</button>
          <button id="sub" aria-label="Minus">-</button>
          <button id="multi" aria-label="Multiply">*</button>
          <button id="div" aria-label="Divide">/</button>
        </div>
      </div>
    </div>
    <script src="calculator.js"></script>
    <script src="Calc.js"></script>
  </body>
</html>
